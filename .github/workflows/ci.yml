name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          AI_PROVIDER: mock
        run: pytest -q --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

      - name: Migration drift check
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          AI_PROVIDER: mock
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & production build
        run: npm run build
        env:
          VITE_API_URL: https://mokhik.online/api
          VITE_WS_URL: wss://mokhik.online/ws

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose files
        env:
          POSTGRES_PASSWORD: ci-validation-only
          AWS_ACCESS_KEY_ID: ci-validation-only
          AWS_SECRET_ACCESS_KEY: ci-validation-only-secret
        run: |
          # prod compose references env_file: .env (gitignored); stub it for validation only
          cp .env.production.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: viva-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: viva-frontend:ci
          build-args: |
            VITE_API_URL=https://mokhik.online/api
            VITE_WS_URL=wss://mokhik.online/ws
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ai-eval:
    name: AI evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mock AI evaluation suite
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          AI_PROVIDER: mock
        run: python ../scripts/eval/run_eval.py
